<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>JellyStation – Quallen-Controller im Neon-Look</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14245a"/>
      <stop offset="0.55" stop-color="#0a1233"/>
      <stop offset="1" stop-color="#04060f"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ff2d95" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ff2d95" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2d95" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff2d95" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="glowBig" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowSmall" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>

    <!-- Alle Neonlinien: einmal als Form, drei Mal gezeichnet (Schein, Farbe, heller Kern) -->
    <g id="neon" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Glocke: Kuppel mit Controller-Schultern, unten gewellter Saum -->
      <path d="M232 520 C232 360 358 262 512 262 C666 262 792 360 792 520
               C792 548 770 560 748 556 C730 590 700 590 680 556 C660 590 626 590 606 556
               C586 590 548 590 512 556 C476 590 438 590 418 556 C398 590 364 590 344 556
               C322 590 292 590 276 556 C254 560 232 548 232 520 Z"/>
      <!-- Steuerkreuz -->
      <path d="M355 395 h34 v-34 h34 v34 h34 v34 h-34 v34 h-34 v-34 h-34 Z" transform="translate(-8 24)"/>
      <!-- Aktionstasten als Raute: △ oben, ○ rechts, ✕ unten, □ links -->
      <path d="M659 381 L680 345 L701 381 Z"/>
      <circle cx="738" cy="420" r="20"/>
      <path d="M663 460 l34 34 M697 460 l-34 34"/>
      <rect x="607" y="403" width="34" height="34" rx="2"/>
      <!-- zwei Analogsticks wie Flecken auf der Qualle -->
      <circle cx="452" cy="506" r="23"/>
      <circle cx="572" cy="506" r="23"/>
      <!-- Mittelteil: PS-Knopf -->
      <circle cx="512" cy="424" r="15"/>
      <!-- Tentakel: gewellt, die äußeren enden in Controller-Griffen -->
      <path d="M344 590 C318 640 372 680 344 730 C326 764 352 790 340 826"/>
      <path d="M418 590 C396 650 444 690 418 750 C406 784 424 806 416 846"/>
      <path d="M512 592 C486 652 538 696 512 756 C500 792 522 818 512 862"/>
      <path d="M606 590 C628 650 580 690 606 750 C618 784 600 806 608 846"/>
      <path d="M680 590 C706 640 652 680 680 730 C698 764 672 790 684 826"/>
      <!-- Blasen und Funken -->
      <circle cx="288" cy="338" r="9"/>
      <circle cx="756" cy="312" r="12"/>
      <circle cx="800" cy="410" r="6"/>
    </g>
  </defs>

  <!-- Kachel: tiefes PS3-Blau mit Wellen -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#halo)"/>
    <g fill="none" stroke="#7aa2ff" stroke-opacity="0.10" stroke-width="3">
      <path d="M60 700 C240 620 360 780 540 700 S800 640 980 720"/>
      <path d="M60 760 C260 690 380 840 560 770 S820 700 980 780"/>
      <path d="M60 820 C240 760 400 890 580 830 S820 770 980 850"/>
    </g>
    <rect x="100" y="100" width="824" height="824" fill="none" stroke="#9db8ff" stroke-opacity="0.18" stroke-width="3" rx="185"/>
  </g>

  <!-- Glocken-Füllung -->
  <path d="M232 520 C232 360 358 262 512 262 C666 262 792 360 792 520 C792 548 770 560 748 556 C730 590 700 590 680 556 C660 590 626 590 606 556 C586 590 548 590 512 556 C476 590 438 590 418 556 C398 590 364 590 344 556 C322 590 292 590 276 556 C254 560 232 548 232 520 Z" fill="url(#belly)"/>

  <!-- Neon: Schein, Farbe, Kern -->
  <use href="#neon" stroke="#ff2d95" stroke-width="30" opacity="0.85" filter="url(#glowBig)"/>
  <use href="#neon" stroke="#ff3da0" stroke-width="15" filter="url(#glowSmall)"/>
  <use href="#neon" stroke="#ff4fae" stroke-width="12"/>
  <use href="#neon" stroke="#ffe3f3" stroke-width="4.5"/>
</svg>
