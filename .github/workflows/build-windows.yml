# Baut JellyStation für Windows und hängt die Installer (.exe, .msi) an dieselbe GitHub-Release wie die Mac-DMG.
#
# Auslösen:  git tag v0.1.0 && git push origin v0.1.0     (läuft zusammen mit dem Mac-Build und füllt dieselbe Release)
#   oder in GitHub: Actions → „Windows-Build“ → Run workflow, dort den Tag der Release eintragen (z. B. v0.1.0).
#   Gibt es die Release noch nicht, legt der Lauf sie an.
# Zusätzlich zum versionierten Installer wird eine Datei mit festem Namen hochgeladen (JellyStation-Windows-Setup.exe).
#   Darauf zeigt der Download-Link im README (…/releases/latest/download/<Name>).
# Zusätzlich liegen die Dateien als Artefakt „JellyStation-Windows“ auf der Lauf-Seite (läuft nach 90 Tagen ab).
# Die App ist NICHT signiert: Windows SmartScreen warnt beim ersten Start („Weitere Informationen“ → „Trotzdem ausführen“).
name: Windows-Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag der Release, an die die Windows-Dateien gehängt werden"
        required: true
        default: "v0.1.0"
  push:
    tags: ["v*"]
  # Testlauf ohne Release, wenn nur dieser Workflow geändert wird (z. B. im Pull Request)
  pull_request:
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Leer (Pull Request) = nur bauen, keine Release anfassen
          tagName: ${{ github.event_name == 'push' && github.ref_name || github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          args: --bundles nsis,msi
      # Installer ein zweites Mal mit festem, versionslosem Namen anhängen (für den Link im README)
      - name: Installer mit festem Namen hochladen
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*.exe JellyStation-Windows-Setup.exe
          gh release upload "$TAG" JellyStation-Windows-Setup.exe --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: JellyStation-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
