[package]
name = "jellystation"
version = "0.1.0"
description = "JellyStation – ein XMB-Media-Frontend"
edition = "2021"

[lib]
name = "jellystation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-persisted-scope = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Medien-Proxy (media_proxy.rs): kleiner HTTP-Server nur auf 127.0.0.1 und ein Client zum Jellyfin-Server.
# hyper/reqwest sind ohnehin über tauri-plugin-http an Bord; reqwest nutzt denselben TLS-Stack (rustls) wie das Plugin,
# damit kein zweiter eingeführt wird. Alle Tokio-Funktionen stehen hier (nicht in dev-dependencies), damit
# "cargo test" und "cargo build" dieselben Abhängigkeiten teilen und nicht alles neu übersetzen.
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time", "macros", "io-util"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
getrandom = "0.3"
subtle = "2"

# Emulator-Suche und -Start (emulators.rs)
plist = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
