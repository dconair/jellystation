<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>JellyStation – schwimmende Quallen-Glocke mit PlayStation-Symbolen im Teal-Neon-Look</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0b3a52"/>
      <stop offset="0.5" stop-color="#06213a"/>
      <stop offset="1" stop-color="#020a18"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.58" cy="0.38" r="0.5">
      <stop offset="0" stop-color="#19e6d2" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#19e6d2" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#19e6d2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27f0da" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0a5a6a" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd0ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a3a6a" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19e6d2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#19e6d2" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="glowBig" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="glowSmall" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>

    <!-- Glockenumriss (lokale Koordinaten, Glockenrand bei y = 0, Schwimmrichtung = nach oben) -->
    <path id="bell" d="M-225 4 C-225 -130 -130 -232 0 -232 C130 -232 225 -130 225 4
                      C225 26 208 34 190 30 C176 62 150 62 134 30 C118 62 92 62 76 30 C60 62 34 62 18 30
                      C2 62 -22 62 -38 30 C-54 62 -80 62 -96 30 C-112 62 -138 62 -154 30 C-170 62 -196 62 -206 30
                      C-216 34 -225 26 -225 4 Z"/>

    <!-- Neonlinien der Qualle -->
    <g id="neon" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#bell"/>
      <!-- die vier PlayStation-Symbole: aufrecht (gegen die Neigung der Qualle gedreht) und größer -->
      <g transform="translate(0 -102) rotate(-32) scale(1.25) translate(0 102)">
      <path d="M-22 -140 L0 -178 L22 -140 Z"/>
      <circle cx="62" cy="-102" r="21"/>
      <path d="M-17 -85 l34 34 M17 -85 l-34 34"/>
      <rect x="-80" y="-120" width="36" height="36" rx="2"/>
      </g>
      <!-- Tentakel, im Schwimmen nach hinten gezogen -->
      <path d="M-150 56 C-176 110 -118 150 -158 214 C-186 258 -150 292 -196 344"/>
      <path d="M-76 62 C-98 124 -40 168 -86 236 C-112 280 -78 322 -118 388"/>
      <path d="M0 64 C-22 132 40 176 -4 250 C-28 296 6 340 -26 412"/>
      <path d="M76 62 C54 124 112 166 70 232 C46 272 78 310 48 372"/>
      <path d="M150 56 C130 108 184 142 150 200 C130 238 160 266 140 312"/>
    </g>
  </defs>

  <!-- Kachel: PS3-Tiefblau mit Teal-Schein und Wellen -->
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#halo)"/>
    <!-- XMB-artige Wellenbänder -->
    <path d="M60 560 C220 470 360 640 540 560 S820 470 990 580 L990 980 L60 980 Z" fill="url(#wave2)"/>
    <path d="M60 650 C240 560 380 730 560 650 S830 570 990 670 L990 980 L60 980 Z" fill="url(#wave1)"/>
    <path d="M60 760 C260 690 400 830 590 760 S840 700 990 780 L990 980 L60 980 Z" fill="url(#wave1)" opacity="0.8"/>
    <g fill="none" stroke-linecap="round">
      <path d="M60 560 C220 470 360 640 540 560 S820 470 990 580" stroke="#6ff5e6" stroke-opacity="0.45" stroke-width="3" filter="url(#soft)"/>
      <path d="M60 650 C240 560 380 730 560 650 S830 570 990 670" stroke="#6ff5e6" stroke-opacity="0.5" stroke-width="3.5" filter="url(#soft)"/>
      <path d="M60 760 C260 690 400 830 590 760 S840 700 990 780" stroke="#6ff5e6" stroke-opacity="0.38" stroke-width="3" filter="url(#soft)"/>
    </g>
    <rect x="100" y="100" width="824" height="824" fill="none" stroke="#9fefff" stroke-opacity="0.18" stroke-width="3" rx="185"/>
  </g>

  <!-- Bewegungsspur: Linien und Blasen hinter der Qualle -->
  <g fill="none" stroke="#19e6d2" stroke-linecap="round" opacity="0.8">
    <path d="M214 612 C262 590 318 556 352 506" stroke-width="7" stroke-opacity="0.35"/>
    <path d="M176 700 C238 676 296 640 338 586" stroke-width="5" stroke-opacity="0.28"/>
    <path d="M262 770 C310 746 352 712 384 668" stroke-width="5" stroke-opacity="0.22"/>
    <circle cx="258" cy="470" r="11" stroke-width="5"/>
    <circle cx="206" cy="544" r="7" stroke-width="4"/>
    <circle cx="300" cy="396" r="6" stroke-width="4"/>
    <circle cx="788" cy="800" r="9" stroke-width="4"/>
  </g>

  <!-- Die Qualle: schräg nach rechts oben schwimmend -->
  <g transform="translate(598 470) rotate(32)">
    <use href="#bell" fill="url(#belly)"/>
    <use href="#neon" stroke="#19e6d2" stroke-width="30" opacity="0.85" filter="url(#glowBig)"/>
    <use href="#neon" stroke="#2cf0dc" stroke-width="15" filter="url(#glowSmall)"/>
    <use href="#neon" stroke="#3ff2e0" stroke-width="12"/>
    <use href="#neon" stroke="#e3fffb" stroke-width="4.5"/>
  </g>
</svg>
