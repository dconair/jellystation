      <g stroke="url(#tent)" stroke-width="32" transform="translate(-2 0)"><path d="M-108 134 C-118 200 -168 250 -176 326 C-180 366 -198 394 -210 430"/><path d="M-44 146 C-52 212 -92 270 -112 340 C-122 372 -118 400 -130 420"/><path d="M40 148 C46 212 24 280 34 346 C38 380 22 410 30 442"/><path d="M110 136 C122 200 166 236 150 310 C142 350 164 380 152 412"/></g>
      <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="7" transform="translate(-9 -2)"><path d="M-108 134 C-118 200 -168 250 -176 326 C-180 366 -198 394 -210 430"/><path d="M-44 146 C-52 212 -92 270 -112 340 C-122 372 -118 400 -130 420"/><path d="M40 148 C46 212 24 280 34 346 C38 380 22 410 30 442"/><path d="M110 136 C122 200 166 236 150 310 C142 350 164 380 152 412"/></g>
    </g>
    <!-- Randwulst unter der Kuppel -->
    <path d="M-172 66 C-122 100 -60 108 0 108 C60 108 122 100 172 66 C178 104 142 132 92 142 C40 150 -40 150 -92 142 C-142 132 -178 104 -172 66 Z" fill="url(#skirt)"/>
    <path d="M-160 84 C-110 116 -56 126 0 126 C56 126 110 116 160 84" fill="none" stroke="#e3fffb" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M-172 66 C-122 100 -60 108 0 108 C60 108 122 100 172 66 C178 104 142 132 92 142 C40 150 -40 150 -92 142 C-142 132 -178 104 -172 66 Z" fill="none" stroke="#3ff2e0" stroke-width="4" stroke-opacity="0.75"/>
    <!-- Kuppel -->
    <path d="M-216 8 C-228 -152 -122 -252 0 -252 C132 -252 228 -152 216 8 C212 62 168 88 0 88 C-168 88 -212 62 -216 8 Z" fill="url(#body)"/>
    <g clip-path="url(#domeClip)">
      <!-- Tiefe: dunkler Kern unten rechts, Streulicht im Glas, Lichtkante am Rand -->
      <ellipse cx="86" cy="52" rx="190" ry="120" fill="#0a6a8a" opacity="0.32" filter="url(#blur14)"/>
      <ellipse cx="-20" cy="70" rx="150" ry="26" fill="#9ffcf0" opacity="0.4" filter="url(#blur6)"/>
      <path d="M-216 8 C-228 -152 -122 -252 0 -252 C132 -252 228 -152 216 8 C212 62 168 88 0 88 C-168 88 -212 62 -216 8 Z" fill="none" stroke="#9ffcf0" stroke-width="30" opacity="0.5" filter="url(#blur6)"/>
      <path d="M-216 8 C-212 62 -168 88 0 88 C168 88 212 62 216 8" fill="none" stroke="#c9fff8" stroke-width="12" opacity="0.7" filter="url(#blur6)"/>
      <!-- großer weicher Glanz links oben -->
      <ellipse cx="-96" cy="-150" rx="96" ry="52" fill="#fff" opacity="0.5" filter="url(#blur14)" transform="rotate(-24 -96 -150)"/>
    </g>
    
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#19e6d2" stroke-width="19.2" opacity="0.6400000000000001" filter="url(#glowBig)"><path d="M-216 8 C-228 -152 -122 -252 0 -252 C132 -252 228 -152 216 8 C212 62 168 88 0 88 C-168 88 -212 62 -216 8 Z"/></g>
      <g stroke="#3ff2e0" stroke-width="9.6" filter="url(#glowSmall)"><path d="M-216 8 C-228 -152 -122 -252 0 -252 C132 -252 228 -152 216 8 C212 62 168 88 0 88 C-168 88 -212 62 -216 8 Z"/></g>
      <g stroke="#3ff2e0" stroke-width="8"><path d="M-216 8 C-228 -152 -122 -252 0 -252 C132 -252 228 -152 216 8 C212 62 168 88 0 88 C-168 88 -212 62 -216 8 Z"/></g>
      <g stroke="#e3fffb" stroke-width="2.88"><path d="M-216 8 C-228 -152 -122 -252 0 -252 C132 -252 228 -152 216 8 C212 62 168 88 0 88 C-168 88 -212 62 -216 8 Z"/></g>
    </g>
    <!-- scharfe Glanzlichter -->
    <path d="M-176 -74 C-170 -148 -112 -204 -46 -220" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="13" stroke-linecap="round" filter="url(#soft)"/>
    <circle cx="-96" cy="-142" r="14" fill="#fff" filter="url(#soft)"/>
    <circle cx="-72" cy="-176" r="5" fill="#fff" opacity="0.8"/>
    <!-- Symbole: eingraviert (Schatten) und orange leuchtend -->
    <g transform="translate(4 6)" opacity="0.5" stroke="#04384f" stroke-width="13" filter="url(#soft)"><g fill="none" stroke-linecap="round" stroke-linejoin="round" >
  <path d="M-27 -156 L0 -202 L27 -156 Z" transform="translate(0 26)"/>
  <circle cx="90" cy="-80" r="25"/>
  <path d="M-22 -14 l44 44 M22 -14 l-44 44" transform="translate(0 -8)"/>
  <rect x="-113" y="-103" width="46" height="46" rx="4"/></g></g>
    
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#ff8a1f" stroke-width="28.799999999999997" opacity="0.8" filter="url(#glowBig)"><g fill="none" stroke-linecap="round" stroke-linejoin="round" >
  <path d="M-27 -156 L0 -202 L27 -156 Z" transform="translate(0 26)"/>
  <circle cx="90" cy="-80" r="25"/>
  <path d="M-22 -14 l44 44 M22 -14 l-44 44" transform="translate(0 -8)"/>
  <rect x="-113" y="-103" width="46" height="46" rx="4"/></g></g>
      <g stroke="#ffb347" stroke-width="14.399999999999999" filter="url(#glowSmall)"><g fill="none" stroke-linecap="round" stroke-linejoin="round" >
  <path d="M-27 -156 L0 -202 L27 -156 Z" transform="translate(0 26)"/>
  <circle cx="90" cy="-80" r="25"/>
  <path d="M-22 -14 l44 44 M22 -14 l-44 44" transform="translate(0 -8)"/>
  <rect x="-113" y="-103" width="46" height="46" rx="4"/></g></g>
      <g stroke="#ffb347" stroke-width="12"><g fill="none" stroke-linecap="round" stroke-linejoin="round" >
  <path d="M-27 -156 L0 -202 L27 -156 Z" transform="translate(0 26)"/>
  <circle cx="90" cy="-80" r="25"/>
  <path d="M-22 -14 l44 44 M22 -14 l-44 44" transform="translate(0 -8)"/>
  <rect x="-113" y="-103" width="46" height="46" rx="4"/></g></g>
      <g stroke="#fff1d6" stroke-width="4.32"><g fill="none" stroke-linecap="round" stroke-linejoin="round" >
  <path d="M-27 -156 L0 -202 L27 -156 Z" transform="translate(0 26)"/>
  <circle cx="90" cy="-80" r="25"/>
  <path d="M-22 -14 l44 44 M22 -14 l-44 44" transform="translate(0 -8)"/>
  <rect x="-113" y="-103" width="46" height="46" rx="4"/></g></g>
    </g>
  </g>
</svg>
